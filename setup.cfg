[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-erase=1
cover-package=service

[coverage:run]
branch = True
source = service
omit =
    */tests/*
    */common/log_handlers.py

[coverage:report]
show_missing = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    sys.exit

[flake8]
max-line-length = 127
max-complexity = 10
per-file-ignores =
    */__init__.py: F401 E402
ignore = E203, W503

[pylint.'MESSAGES CONTROL']
disable = E1101, C0103, R0903, W0703, R0801

[pylint.FORMAT]
max-line-length = 127
